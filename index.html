<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Juego de Territorio GPS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <!-- Leaflet (Mapas) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Turf.js (Geometría) -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Modal de Nombre de Jugador -->
  <div id="modal-nickname">
    <div class="modal-content">
      <h2>¡Bienvenido al Juego!</h2>
      <p>Escribe tu nombre o apodo para jugar:</p>
      <input type="text" id="input-nickname" placeholder="Tu Apodo" maxlength="15" />
      <button id="btn-join">Entrar al Juego</button>
    </div>
  </div>

  <div id="map"></div>
  
  <div id="ui-panel">

<div id="leaderboard-panel">
  <h3>🏆 Tabla de Posiciones</h3>
  <ul id="leaderboard-list">
    <li class="empty-msg">Sin territorios aún</li>
  </ul>
</div>
    <p><strong id="player-name-display">Jugador</strong>: <span id="area-val">0</span> m²</p>
    <div id="btn-group">
      <button id="btn-start">Iniciar Recorrido</button>
      <button id="btn-stop" disabled>Terminar / Calcular</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
